
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAVI WALKER | Área do Cliente</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff;
  color:#174ea6;
}

header{
  background:#fff;
  border-bottom:1px solid #dce8f8;
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

header h1{font-size:18px;margin:0}
header p{font-size:11px;margin:4px 0 0;color:#64748b}

button{cursor:pointer;font-family:inherit}

.sair{
  background:#fff;
  color:#174ea6;
  border:1px solid #174ea6;
  border-radius:7px;
  padding:7px 10px;
  font-size:11px;
}

main{
  max-width:950px;
  margin:auto;
  padding:14px;
}

.boas-vindas{
  background:#fff;
  border:1px solid #dce8f8;
  border-radius:10px;
  padding:13px;
  margin-bottom:14px;
}

.boas-vindas h2{font-size:16px;margin:0 0 5px}
.boas-vindas p{font-size:12px;color:#64748b;margin:0}

.titulo-servicos{
  font-size:14px;
  margin:15px 0 9px;
}

.grade-servicos{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
}

.servico{
  background:#fff;
  border:1px solid #dce8f8;
  border-radius:8px;
  padding:0;
  overflow:hidden;
  color:#174ea6;
  text-align:center;
  min-width:0;
}

.servico:active{transform:scale(.97)}
.servico:hover{border-color:#174ea6}

.servico img{
  display:block;
  width:100%;
  height:75px;
  object-fit:cover;
}

.servico span{
  display:flex;
  min-height:35px;
  align-items:center;
  justify-content:center;
  padding:5px 3px;
  font-size:10px;
  line-height:1.2;
  font-weight:bold;
}

.modal-fundo{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  padding:15px;
  align-items:center;
  justify-content:center;
  z-index:10;
  overflow-y:auto;
}

.modal{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:12px;
  padding:18px;
  box-shadow:0 8px 30px #0002;
  max-height:90vh;
  overflow-y:auto;
}

.modal h2{font-size:19px;margin:0 0 8px}

.modal p{
  font-size:13px;
  line-height:1.5;
  color:#53657c;
}

.campo{margin-top:12px}

.campo label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin-bottom:5px;
}

.campo input{
  width:100%;
  padding:11px;
  border:1px solid #dce8f8;
  border-radius:7px;
  outline:none;
  font-size:13px;
  color:#174ea6;
}

.campo input:focus{border-color:#174ea6}

.modal-acoes{
  display:flex;
  gap:8px;
  margin-top:16px;
}

.modal-acoes button{
  flex:1;
  padding:10px;
  border-radius:7px;
  font-size:12px;
}

.btn-fechar{
  background:#fff;
  color:#174ea6;
  border:1px solid #174ea6;
}

.btn-abrir{
  background:#174ea6;
  color:#fff;
  border:1px solid #174ea6;
}

#mensagem{
  display:none;
  margin-top:12px;
  padding:12px;
  border-radius:8px;
  background:#eef5ff;
  color:#174ea6;
  font-size:12px;
  line-height:1.5;
}

@media(max-width:500px){
  main{padding:10px}
  .grade-servicos{
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:6px;
  }
  .servico img{height:62px}
  .servico span{font-size:9px;min-height:32px}
  header h1{font-size:16px}
}
</style>
</head>

<body>

<header>
  <div>
    <h1>DAVI WALKER</h1>
    <p>Área do Cliente</p>
  </div>
  <button class="sair" onclick="sair()">Sair</button>
</header>

<main>

<section class="boas-vindas">
  <h2>Bem-vindo à área do cliente!</h2>
  <p>Escolha um serviço, informe seus dados e envie sua solicitação para Davi Walker.</p>
</section>

<h2 class="titulo-servicos">Escolha o serviço desejado</h2>

<section class="grade-servicos" id="grade-servicos"></section>

</main>

<div class="modal-fundo" id="modal-fundo">
  <div class="modal">

    <h2 id="modal-titulo">Solicitar serviço</h2>
    <p id="modal-descricao"></p>

    <div class="campo">
      <label for="nome">Seu nome</label>
      <input id="nome" type="text" placeholder="Ex.: Paulo">
    </div>

    <div class="campo">
      <label for="empresa">Nome da empresa</label>
      <input id="empresa" type="text" placeholder="Ex.: Look">
    </div>

    <div class="campo">
      <label for="site">Site ou URL</label>
      <input id="site" type="url" placeholder="https://www.suaempresa.com.br">
    </div>

    <div class="modal-acoes">
      <button class="btn-fechar" onclick="fecharServico()">Voltar</button>
      <button class="btn-abrir" onclick="enviarPedido()">Enviar pedido</button>
    </div>

    <div id="mensagem"></div>

  </div>
</div>

<script>

const servicos = [
{
nome:"SEO",
descricao:"Estratégias para ajudar empresas e produtos a aparecerem nas pesquisas do Google.",
imagem:"https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=600"
},
{
nome:"Tráfego Pago",
descricao:"Criação e planejamento de anúncios pagos para divulgar produtos e serviços.",
imagem:"https://images.unsplash.com/photo-1557838923-2985c318be48?w=600"
},
{
nome:"Marketing de Conteúdo",
descricao:"Criação de textos e conteúdos para apresentar produtos, serviços e empresas.",
imagem:"https://images.unsplash.com/photo-1455390582262-044cdead277a?w=600"
},
{
nome:"Redes Sociais",
descricao:"Planejamento de publicações e divulgação de empresas nas redes sociais.",
imagem:"https://images.unsplash.com/photo-1611162617474-5b21e879e113?w=600"
},
{
nome:"E-mail Marketing",
descricao:"Criação de mensagens para apresentar novidades, ofertas e informações aos clientes.",
imagem:"https://images.unsplash.com/photo-1596526131083-e8c633c948d2?w=600"
},
{
nome:"Métricas",
descricao:"Acompanhamento dos resultados das campanhas e análise de indicadores.",
imagem:"https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=600"
},
{
nome:"Fotografia de Produtos",
descricao:"Apresentação visual de produtos por meio de fotografias para divulgação.",
imagem:"https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=600"
},
{
nome:"Vídeos Publicitários",
descricao:"Produção e planejamento de vídeos para apresentar empresas e produtos.",
imagem:"https://images.unsplash.com/photo-1492619375914-88005aa9e8fb?w=600"
},
{
nome:"Catálogo e Loja Virtual",
descricao:"Organização de produtos em catálogos digitais e páginas de venda.",
imagem:"https://images.unsplash.com/photo-1472851294608-062f824d29cc?w=600"
},
{
nome:"Marketing Local",
descricao:"Divulgação de empresas para alcançar clientes de sua região.",
imagem:"https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=600"
},
{
nome:"Planejamento de Campanhas",
descricao:"Organização de ações e campanhas para divulgar produtos e serviços.",
imagem:"https://images.unsplash.com/photo-1552664730-d307ca884978?w=600"
},
{
nome:"Identidade Visual",
descricao:"Criação e organização da apresentação visual e da marca de uma empresa.",
imagem:"https://images.unsplash.com/photo-1634942536790-253f5f5e7e6b?w=600"
}
];

let servicoSelecionado = null;

function montarServicos(){

  const grade = document.getElementById("grade-servicos");

  servicos.forEach((servico,indice)=>{

    const botao = document.createElement("button");
    botao.type = "button";
    botao.className = "servico";

    const imagem = document.createElement("img");
    imagem.src = servico.imagem;
    imagem.alt = servico.nome;
    imagem.loading = "lazy";

    const nome = document.createElement("span");
    nome.textContent = servico.nome;

    botao.append(imagem,nome);

    botao.addEventListener("click",()=>{
      abrirServico(indice);
    });

    grade.appendChild(botao);

  });
}

function abrirServico(indice){

  servicoSelecionado = servicos[indice];

  document.getElementById("modal-titulo").textContent =
    "Solicitar: " + servicoSelecionado.nome;

  document.getElementById("modal-descricao").textContent =
    servicoSelecionado.descricao;

  document.getElementById("mensagem").style.display = "none";

  document.getElementById("modal-fundo").style.display = "flex";
}

function fecharServico(){

  document.getElementById("modal-fundo").style.display = "none";
  servicoSelecionado = null;

}

function enviarPedido(){

  if(!servicoSelecionado)return;

  const nome = document.getElementById("nome").value.trim();
  const empresa = document.getElementById("empresa").value.trim();
  const site = document.getElementById("site").value.trim();

  if(!nome || !empresa){
    alert("Preencha seu nome e o nome da empresa.");
    return;
  }

  // Preparação local do pedido.
  // Na próxima etapa, este pedido será enviado ao banco
  // e aparecerá no painel administrativo.

  const pedido = {
    servico:servicoSelecionado.nome,
    nome:nome,
    empresa:empresa,
    site:site,
    status:"Aguardando envio ao ADM",
    data:new Date().toISOString()
  };

  console.log("Pedido preparado:",pedido);

  const mensagem = document.getElementById("mensagem");

  mensagem.textContent =
    "Solicitação preenchida com sucesso! " +
    "Na próxima etapa vamos conectar o envio ao painel administrativo.";

  mensagem.style.display = "block";

}

function sair(){

  window.location.href = "./index.html";

}

montarServicos();

</script>

</body>
</html>
